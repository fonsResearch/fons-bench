[project]
name = "fons-bench"
version = "0.0.1"
description = "Do protein-ligand structure models know when they are wrong? A calibration-under-shift benchmark."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "rdkit",
    "spyrmsd",
    "posebusters",
    "gemmi",
    "pyyaml",
    "requests",
    "tabulate>=0.10.0",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
]

[project.scripts]
fons-bench = "fons_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fons_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/fons_bench/artifacts/calibration.json" = "fons_bench/artifacts/calibration.json"

[dependency-groups]
dev = ["pytest"]
